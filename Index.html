<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07080f">
<title>RECOIL — muévete disparando</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#07080f;
    touch-action:none;
    overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  canvas { display:block; position:fixed; inset:0; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

/* =========================================================
   CANVAS / RESIZE
   ========================================================= */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;

// Cuadrado jugable centrado (el reborde rellena lo de fuera)
let BORDER = 80;
let PX = 0, PY = 0, PS = 0;

function updateBorder() {
  const minSide = Math.min(W, H);
  BORDER = Math.round(Math.min(minSide * 0.28, Math.max(55, Math.min(130, minSide * 0.18))));
  PS = Math.max(80, minSide - 2 * BORDER);
  PX = (W - PS) / 2;
  PY = (H - PS) / 2;
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  updateBorder();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
resize();

/* =========================================================
   CONFIGURACIÓN
   ========================================================= */
const CFG = {
  fireInterval : 0.105,
  recoil       : 100,    // retroceso reducido = ÚNICO movimiento
  drag         : 2.4,
  maxSpeed     : 800,
  bulletSpeed  : 980,
  bulletR      : 5,
  bulletLife   : 1.8,
  wallBounce   : 0.55,
  playerR      : 18,
  playerHP     : 100,
};

const ENEMY_TYPES = {
  small: { r:12, hp:1, speed:100, score:1, dmg:12, color:'#ff5c8a', glow:'#ff8fb3' },
  med  : { r:20, hp:3, speed:68,  score:3, dmg:20, color:'#ffa24c', glow:'#ffc98a' },
  big  : { r:34, hp:8, speed:44,  score:8, dmg:30, color:'#a06cff', glow:'#c9a6ff' },
};

/* =========================================================
   AUDIO (Web Audio API — sintetizado, sin archivos)
   ========================================================= */
let actx = null, masterGain = null;
let lastShootSfx = 0, lastHitSfx = 0;

function initAudio() {
  if (actx) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    masterGain = actx.createGain();
    masterGain.gain.value = 0.32;
    masterGain.connect(actx.destination);
  } catch(e) { actx = null; }
}

function resumeAudio() {
  if (!actx) initAudio();
  if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
}

function tone(o) {
  if (!actx || actx.state !== 'running') return;
  const t0 = actx.currentTime, dur = o.dur || 0.1;
  const osc = actx.createOscillator();
  const g = actx.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(Math.max(1, o.f0), t0);
  if (o.f1 !== undefined) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t0 + dur);
  const vol = o.vol || 0.2;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(masterGain);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}

function noise(o) {
  if (!actx || actx.state !== 'running') return;
  const t0 = actx.currentTime, dur = o.dur || 0.1, sr = actx.sampleRate;
  const len = Math.max(1, Math.floor(sr * dur));
  const buf = actx.createBuffer(1, len, sr);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    const e = 1 - i / len;
    data[i] = (Math.random() * 2 - 1) * e * e;
  }
  const src = actx.createBufferSource(); src.buffer = buf;
  const filt = actx.createBiquadFilter();
  filt.type = o.filter || 'highpass';
  filt.frequency.value = o.cutoff || 1000;
  const g = actx.createGain(); g.gain.value = o.vol || 0.15;
  src.connect(filt); filt.connect(g); g.connect(masterGain);
  src.start(t0);
}

function sfxShoot() {
  if (!actx) return;
  const now = actx.currentTime;
  if (now - lastShootSfx < 0.05) return;
  lastShootSfx = now;
  tone({ type:'square',   f0: 900, f1: 200, dur: 0.055, vol: 0.045 });
  tone({ type:'triangle', f0: 1500, f1: 400, dur: 0.045, vol: 0.025 });
  noise({ dur: 0.035, cutoff: 2400, vol: 0.03 });
}

function sfxHit() {
  if (!actx) return;
  const now = actx.currentTime;
  if (now - lastHitSfx < 0.02) return;
  lastHitSfx = now;
  tone({ type:'square', f0: 700, f1: 220, dur: 0.045, vol: 0.06 });
}

function sfxKill() {
  if (!actx) return;
  const d = 0.92 + Math.random() * 0.16;
  tone({ type:'sawtooth', f0: 400 * d, f1: 80, dur: 0.18, vol: 0.1 });
  tone({ type:'square',   f0: 900 * d, f1: 200, dur: 0.1, vol: 0.05 });
  noise({ dur: 0.15, cutoff: 1200, vol: 0.08, filter:'bandpass' });
}

function sfxPlayerHit() {
  if (!actx) return;
  tone({ type:'sawtooth', f0: 220, f1: 55, dur: 0.35, vol: 0.14 });
  tone({ type:'square',   f0: 130, f1: 40, dur: 0.28, vol: 0.1 });
  noise({ dur: 0.28, cutoff: 500, vol: 0.12, filter:'lowpass' });
}

function sfxGameOver() {
  if (!actx) return;
  tone({ type:'sawtooth', f0: 440, f1: 55, dur: 1.2, vol: 0.13 });
  tone({ type:'triangle', f0: 220, f1: 30, dur: 1.0, vol: 0.09 });
}

function sfxClick() {
  if (!actx) return;
  tone({ type:'triangle', f0: 880, f1: 1320, dur: 0.08, vol: 0.07 });
}

/* =========================================================
   ESTADO
   ========================================================= */
let state = 'menu';
let player, bullets, enemies, particles, floaters;
let score = 0, best = 0, gameTime = 0, spawnTimer = 0;
let shake = 0, hitFlash = 0, restartDelay = 0;

try { best = parseInt(localStorage.getItem('recoil_best') || '0', 10) || 0; } catch(e) { best = 0; }

function initWorld() {
  player = {
    x: W/2, y: H/2, r: CFG.playerR,
    vx: 0, vy: 0,
    hp: CFG.playerHP, maxHp: CFG.playerHP,
    aim: -Math.PI/2,
    cd: 0, invuln: 0,
  };
  bullets = [];
  enemies = [];
  particles = [];
  floaters = [];
  score = 0;
  gameTime = 0;
  spawnTimer = 1.2;
  shake = 0;
  hitFlash = 0;
  restartDelay = 0;
}

function startGame() {
  initWorld();
  pointers.clear();
  state = 'playing';
}

/* =========================================================
   INPUT
   ========================================================= */
const pointers = new Map();

function activePointer() {
  const it = pointers.values().next();
  return it.done ? null : it.value;
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  resumeAudio();

  if (state === 'menu') {
    sfxClick();
    startGame();
    return;
  }
  if (state === 'over') {
    if (restartDelay <= 0) {
      sfxClick();
      startGame();
    }
    return;
  }
  try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
}, { passive:false });

canvas.addEventListener('pointermove', (e) => {
  if (pointers.has(e.pointerId)) {
    const p = pointers.get(e.pointerId);
    p.x = e.clientX; p.y = e.clientY;
  }
}, { passive:false });

['pointerup','pointercancel','pointerleave'].forEach(t => {
  canvas.addEventListener(t, (e) => { pointers.delete(e.pointerId); });
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

/* =========================================================
   HELPERS
   ========================================================= */
function rrect(x, y, w, h, r) {
  if (w < 0) { x += w; w = -w; }
  if (h < 0) { y += h; h = -h; }
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function burst(x, y, n, color, speedMul) {
  speedMul = speedMul || 1;
  for (let i = 0; i < n; i++) {
    if (particles.length > 500) break;
    const a  = Math.random() * Math.PI * 2;
    const sp = (60 + Math.random() * 260) * speedMul;
    const life = 0.25 + Math.random() * 0.45;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      r: 1.5 + Math.random() * 3,
      life, maxLife: life,
      color,
    });
  }
}

function addFloater(x, y, text, color) {
  floaters.push({
    x, y, text, color,
    life: 0.9, maxLife: 0.9,
    vy: -75,
  });
}

/* =========================================================
   DISPARO  (retroceso = movimiento)
   ========================================================= */
function shoot() {
  const a  = player.aim;
  const dx = Math.cos(a);
  const dy = Math.sin(a);
  const muzzle = player.r + 12;

  bullets.push({
    x: player.x + dx * muzzle,
    y: player.y + dy * muzzle,
    vx: dx * CFG.bulletSpeed,
    vy: dy * CFG.bulletSpeed,
    r: CFG.bulletR,
    life: CFG.bulletLife,
  });

  // Retroceso (única forma de moverse)
  player.vx -= dx * CFG.recoil;
  player.vy -= dy * CFG.recoil;

  // fogonazo
  for (let i = 0; i < 5; i++) {
    const ang = a + (Math.random() - 0.5) * 0.8;
    const sp  = 120 + Math.random() * 220;
    const life = 0.14 + Math.random() * 0.16;
    particles.push({
      x: player.x + dx * muzzle,
      y: player.y + dy * muzzle,
      vx: Math.cos(ang) * sp + player.vx * 0.25,
      vy: Math.sin(ang) * sp + player.vy * 0.25,
      r: 1.5 + Math.random() * 2.5,
      life, maxLife: life,
      color: '#9fe8ff',
    });
  }

  shake = Math.min(shake + 1.2, 12);
  sfxShoot();
}

/* =========================================================
   ACTUALIZACIÓN
   ========================================================= */
function updatePlayer(dt) {
  const p = activePointer();

  if (p) {
    const dx = p.x - player.x;
    const dy = p.y - player.y;
    if (dx*dx + dy*dy > 64) player.aim = Math.atan2(dy, dx);

    player.cd -= dt;
    let guard = 0;
    while (player.cd <= 0 && guard++ < 3) {
      shoot();
      player.cd += CFG.fireInterval;
    }
  } else {
    player.cd = 0;
  }

  const k = Math.exp(-CFG.drag * dt);
  player.vx *= k;
  player.vy *= k;

  const sp = Math.hypot(player.vx, player.vy);
  if (sp > CFG.maxSpeed) {
    const s = CFG.maxSpeed / sp;
    player.vx *= s; player.vy *= s;
  }

  player.x += player.vx * dt;
  player.y += player.vy * dt;

  const r = player.r;
  const minX = PX + r;
  const maxX = PX + PS - r;
  const minY = PY + r;
  const maxY = PY + PS - r;

  let hit = false;
  if (player.x < minX)       { player.x = minX; player.vx =  Math.abs(player.vx) * CFG.wallBounce; hit = true; }
  else if (player.x > maxX)  { player.x = maxX; player.vx = -Math.abs(player.vx) * CFG.wallBounce; hit = true; }
  if (player.y < minY)       { player.y = minY; player.vy =  Math.abs(player.vy) * CFG.wallBounce; hit = true; }
  else if (player.y > maxY)  { player.y = maxY; player.vy = -Math.abs(player.vy) * CFG.wallBounce; hit = true; }

  if (hit) {
    shake = Math.max(shake, 4);
    burst(player.x, player.y, 4, '#3fd0ff', 0.5);
  }

  if (player.invuln > 0) player.invuln -= dt;
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.life -= dt;
    if (b.life <= 0) { bullets.splice(i, 1); continue; }

    b.x += b.vx * dt;
    b.y += b.vy * dt;

    // Sin rebotes: la bala muere al tocar el borde de la pantalla
    if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) {
      burst(
        Math.max(0, Math.min(W, b.x)),
        Math.max(0, Math.min(H, b.y)),
        3, '#7fe6ff', 0.4
      );
      bullets.splice(i, 1);
    }
  }
}

function updateEnemies(dt) {
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];

    let dx = player.x - e.x;
    let dy = player.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    dx /= d; dy /= d;

    let sx = 0, sy = 0;
    for (let j = 0; j < enemies.length; j++) {
      if (i === j) continue;
      const o = enemies[j];
      const ox = e.x - o.x, oy = e.y - o.y;
      const d2 = ox*ox + oy*oy;
      const minD = e.r + o.r;
      if (d2 < minD*minD && d2 > 0.01) {
        const od = Math.sqrt(d2);
        const f = (1 - od / minD);
        sx += (ox / od) * f;
        sy += (oy / od) * f;
      }
    }

    e.x += (dx * e.speed + sx * 130) * dt;
    e.y += (dy * e.speed + sy * 130) * dt;

    const cr = e.r * 0.55;
    e.x = Math.max(cr, Math.min(W - cr, e.x));
    e.y = Math.max(cr, Math.min(H - cr, e.y));

    e.wob += dt * 5;
    if (e.flash > 0) e.flash -= dt;
  }
}

function updateSpawner(dt) {
  spawnTimer -= dt;
  if (spawnTimer <= 0 && enemies.length < 30) {
    spawnEnemy();
    spawnTimer = Math.max(0.32, 1.6 - gameTime * 0.022);
  }
}

function spawnEnemy() {
  const t = gameTime;
  let type = 'small';
  const rnd = Math.random();
  if (t > 20 && rnd < 0.22)      type = 'big';
  else if (t > 6 && rnd < 0.55)  type = 'med';

  const def = ENEMY_TYPES[type];

  const side = (Math.random() * 4) | 0;
  const margin = def.r + 8;
  let x, y;

  if (side === 0)      { x = Math.random() * W; y = margin; }
  else if (side === 1) { x = W - margin;        y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = H - margin; }
  else                 { x = margin;            y = Math.random() * H; }

  enemies.push({
    x, y,
    r: def.r,
    hp: def.hp, maxHp: def.hp,
    speed: def.speed * (0.9 + Math.random() * 0.3),
    score: def.score, dmg: def.dmg,
    color: def.color, glow: def.glow,
    flash: 0, wob: Math.random() * 6.28,
  });
}

function killEnemy(index, giveScore) {
  const e = enemies[index];
  enemies.splice(index, 1);
  if (giveScore) {
    score += e.score;
    addFloater(e.x, e.y, '+' + e.score, e.glow);
    sfxKill();
  }
  burst(e.x, e.y, 14, e.glow, 1);
  shake = Math.min(shake + 6, 20);
}


function updateParticles(dt) {
  const k = Math.exp(-2.5 * dt);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= k;
    p.vy *= k;
  }
}

function updateFloaters(dt) {
  const k = Math.exp(-2.2 * dt);
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt;
    if (f.life <= 0) { floaters.splice(i, 1); continue; }
    f.y += f.vy * dt;
    f.vy *= k;
  }
}

function checkCollisions() {
  // bala -> enemigo
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      const dx = e.x - b.x, dy = e.y - b.y;
      const rr = e.r + b.r;
      if (dx*dx + dy*dy < rr*rr) {
        bullets.splice(i, 1);
        e.hp -= 1;
        e.flash = 0.12;
        e.x += (b.vx / CFG.bulletSpeed) * 7;
        e.y += (b.vy / CFG.bulletSpeed) * 7;
        burst(b.x, b.y, 6, e.glow, 0.8);
        sfxHit();
        if (e.hp <= 0) killEnemy(j, true);
        break;
      }
    }
  }

  // jugador -> enemigo
  if (player.invuln <= 0) {
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      const dx = e.x - player.x, dy = e.y - player.y;
      const rr = e.r + player.r;
      if (dx*dx + dy*dy < rr*rr) {
        const d = Math.hypot(dx, dy) || 1;
        player.vx -= (dx / d) * 350;
        player.vy -= (dy / d) * 350;

        player.hp -= e.dmg;
        player.invuln = 1.0;
        hitFlash = 1;
        shake = 22;
        burst(player.x, player.y, 18, '#ff4d6d', 1.2);
        sfxPlayerHit();
        killEnemy(j, false);
        if (player.hp <= 0) { player.hp = 0; endGame(); }
        break;
      }
    }
  }
}

function endGame() {
  state = 'over';
  restartDelay = 0.7;
  shake = 30;
  burst(player.x, player.y, 45, '#5ee3ff', 1.6);
  sfxGameOver();
  if (score > best) {
    best = score;
    try { localStorage.setItem('recoil_best', String(best)); } catch(e) {}
  }
}

function update(dt) {
  shake = Math.max(0, shake * Math.exp(-7 * dt) - 1.5 * dt);
  hitFlash = Math.max(0, hitFlash - dt * 3);
  updateParticles(dt);
  updateFloaters(dt);

  if (state !== 'playing') {
    if (state === 'over') restartDelay -= dt;
    return;
  }

  gameTime += dt;

  updatePlayer(dt);
  updateBullets(dt);
  updateEnemies(dt);
  updateSpawner(dt);
  checkCollisions();
}

/* =========================================================
   RENDER
   ========================================================= */
function drawArena() {
  ctx.save();
  ctx.beginPath();
  ctx.rect(PX, PY, PS, PS);
  ctx.clip();

  ctx.strokeStyle = 'rgba(90,140,200,0.09)';
  ctx.lineWidth = 1;
  const g = 64;
  ctx.beginPath();
  for (let x = 0; x <= W + g; x += g) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y <= H + g; y += g) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  ctx.restore();
}

function drawBorderFill() {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.rect(PX, PY, PS, PS);
  ctx.clip('evenodd');

  ctx.fillStyle = 'rgba(255,50,85,0.07)';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(255,80,110,0.10)';
  ctx.lineWidth = 2;
  const step = 18;
  ctx.beginPath();
  for (let i = -H; i < W + H; i += step) {
    ctx.moveTo(i, 0);
    ctx.lineTo(i + H, H);
  }
  ctx.stroke();

  ctx.restore();
}

function drawBorderEdge() {
  const t = performance.now() / 1000;
  const pulse = 0.30 + 0.16 * Math.sin(t * 3);

  ctx.strokeStyle = 'rgba(255,80,120,' + pulse.toFixed(3) + ')';
  ctx.lineWidth = 2;
  ctx.strokeRect(PX + 1, PY + 1, PS - 2, PS - 2);

  ctx.strokeStyle = 'rgba(255,80,120,0.10)';
  ctx.lineWidth = 6;
  ctx.strokeRect(PX + 3, PY + 3, PS - 6, PS - 6);
}

function drawParticles() {
  if (!particles.length) return;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const a = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * a + 0.3, 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawBullets() {
  if (!bullets.length) return;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    const tx = b.x - b.vx * 0.018;
    const ty = b.y - b.vy * 0.018;

    ctx.strokeStyle = 'rgba(120,230,255,0.55)';
    ctx.lineWidth = b.r * 1.5;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();

    ctx.fillStyle = '#e8fbff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, 6.2832);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawEnemies() {
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    const pulse = 1 + Math.sin(e.wob) * 0.04;

    ctx.save();
    ctx.translate(e.x, e.y);

    const g = ctx.createRadialGradient(0, 0, e.r * 0.4, 0, 0, e.r * 2.4);
    g.addColorStop(0, e.glow + '55');
    g.addColorStop(1, e.glow + '00');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, e.r * 2.4, 0, 6.2832);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, e.r * pulse, 0, 6.2832);
    ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.color;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.stroke();

    const ang = Math.atan2(player.y - e.y, player.x - e.x);
    const ex = Math.cos(ang) * e.r * 0.32;
    const ey = Math.sin(ang) * e.r * 0.32;
    const px = -Math.sin(ang) * e.r * 0.30;
    const py =  Math.cos(ang) * e.r * 0.30;
    const eyeR = Math.max(2, e.r * 0.17);

    ctx.fillStyle = '#0a0a12';
    ctx.beginPath(); ctx.arc(ex + px, ey + py, eyeR, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(ex - px, ey - py, eyeR, 0, 6.2832); ctx.fill();

    ctx.restore();
  }
}

function drawPlayer() {
  const p = player;
  const blink = p.invuln > 0 && (Math.floor(p.invuln * 16) % 2 === 0);

  const ptr = activePointer();
  if (ptr && state === 'playing') {
    ctx.save();
    ctx.setLineDash([7, 9]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(140,230,255,0.22)';
    ctx.beginPath();
    ctx.moveTo(p.x + Math.cos(p.aim) * p.r, p.y + Math.sin(p.aim) * p.r);
    ctx.lineTo(ptr.x, ptr.y);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = 'rgba(140,230,255,0.45)';
    ctx.beginPath();
    ctx.arc(ptr.x, ptr.y, 14, 0, 6.2832);
    ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(p.x, p.y);

  const g = ctx.createRadialGradient(0, 0, p.r * 0.5, 0, 0, p.r * 2.9);
  g.addColorStop(0, 'rgba(70,200,255,0.35)');
  g.addColorStop(1, 'rgba(70,200,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, p.r * 2.9, 0, 6.2832);
  ctx.fill();

  ctx.save();
  ctx.rotate(p.aim);
  ctx.fillStyle = blink ? '#ffffff' : '#8fe9ff';
  rrect(p.r - 5, -5, 23, 10, 5);
  ctx.fill();
  ctx.restore();

  ctx.beginPath();
  ctx.arc(0, 0, p.r, 0, 6.2832);
  const bg = ctx.createRadialGradient(-p.r * 0.35, -p.r * 0.35, 2, 0, 0, p.r);
  bg.addColorStop(0, blink ? '#ffffff' : '#3fd0ff');
  bg.addColorStop(1, blink ? '#ff9fb8' : '#0b3f59');
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = blink ? '#ff4d6d' : '#a8f0ff';
  ctx.stroke();

  ctx.restore();
}

function drawFloaters() {
  if (!floaters.length) return;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  for (let i = 0; i < floaters.length; i++) {
    const f = floaters[i];
    const a = Math.max(0, f.life / f.maxLife);
    const scale = 1 + (1 - a) * 0.35;
    const size = 18 * scale;

    ctx.globalAlpha = a;
    ctx.font = '900 ' + size.toFixed(1) + 'px -apple-system, "Segoe UI", Roboto, sans-serif';

    ctx.lineWidth = 3.5;
    ctx.strokeStyle = 'rgba(5,8,15,0.9)';
    ctx.strokeText(f.text, f.x, f.y);

    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawUI() {
  if (state === 'menu') return;

  const bw = Math.min(W * 0.52, 230), bh = 12;
  const bx = 16, by = 16;

  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  rrect(bx, by, bw, bh, 6);
  ctx.fill();

  const hpc = Math.max(0, player.hp / player.maxHp);
  if (hpc > 0) {
    if (hpc > 0.35) {
      const grd = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      grd.addColorStop(0, '#2ee6a8');
      grd.addColorStop(1, '#7fe6ff');
      ctx.fillStyle = grd;
    } else {
      ctx.fillStyle = '#ff4d6d';
    }
    rrect(bx, by, bw * hpc, bh, 6);
    ctx.fill();
  }

  ctx.font = '600 12px -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(180,215,240,0.65)';
  ctx.fillText('VIDA', bx, by + bh + 6);

  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#eaf6ff';
  ctx.font = '800 26px -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText(String(score), W - 16, 14);

  ctx.font = '600 12px -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillStyle = 'rgba(180,215,240,0.55)';
  ctx.fillText('RÉCORD ' + best, W - 16, 46);

  if (state === 'playing' && gameTime < 5) {
    const a = Math.min(1, Math.max(0, (5 - gameTime) / 1.4));
    ctx.globalAlpha = a * 0.85;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#9fd8f5';
    ctx.font = '600 15px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.fillText('Mantén pulsado para disparar', W/2, H - 74);
    ctx.fillStyle = 'rgba(159,216,245,0.65)';
    ctx.font = '600 13px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.fillText('el retroceso te empuja en dirección opuesta', W/2, H - 50);
    ctx.globalAlpha = 1;
  }
}

function drawMenu() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const cy = H * 0.42;

  ctx.fillStyle = '#5ee3ff';
  ctx.font = '900 ' + Math.min(64, W * 0.16) + 'px -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('RECOIL', W/2, cy);

  ctx.fillStyle = 'rgba(140,200,235,0.85)';
  ctx.font = '600 15px -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('no puedes caminar. solo disparar.', W/2, cy + 46);

  ctx.fillStyle = 'rgba(200,230,250,0.75)';
  ctx.font = '500 14px -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('Mantén el dedo en pantalla para apuntar y disparar.', W/2, cy + 108);
  ctx.fillText('El retroceso del arma es tu ÚNICO movimiento.', W/2, cy + 132);
  ctx.fillText('Esquiva, rebota en las paredes y elimina enemigos.', W/2, cy + 156);

  ctx.fillStyle = 'rgba(255,140,160,0.85)';
  ctx.font = '600 13px -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('El área de juego es el cuadrado central.', W/2, cy + 186);
  ctx.fillText('El reborde rojo es zona enemiga: tú no puedes entrar.', W/2, cy + 206);

  const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 350);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#2ee6a8';
  ctx.font = '800 18px -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('TOCA PARA JUGAR', W/2, cy + 254);
  ctx.globalAlpha = 1;

  if (best > 0) {
    ctx.fillStyle = 'rgba(180,215,240,0.5)';
    ctx.font = '600 13px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.fillText('RÉCORD: ' + best, W/2, cy + 296);
  }
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(5,7,15,0.8)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = '#ff5c8a';
  ctx.font = '900 ' + Math.min(46, W * 0.12) + 'px -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('GAME OVER', W/2, H * 0.36);

  ctx.fillStyle = '#eaf6ff';
  ctx.font = '800 34px -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText(String(score), W/2, H * 0.46);

  ctx.fillStyle = 'rgba(140,180,210,0.8)';
  ctx.font = '600 14px -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('PUNTUACIÓN', W/2, H * 0.46 + 30);

  if (score >= best && score > 0) {
    ctx.fillStyle = '#2ee6a8';
    ctx.font = '800 15px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.fillText('¡NUEVO RÉCORD!', W/2, H * 0.46 + 58);
  } else {
    ctx.fillStyle = 'rgba(140,180,210,0.6)';
    ctx.font = '600 14px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.fillText('RÉCORD: ' + best, W/2, H * 0.46 + 58);
  }

  if (restartDelay <= 0) {
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 300);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#5ee3ff';
    ctx.font = '800 18px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.fillText('TOCA PARA REINTENTAR', W/2, H * 0.72);
    ctx.globalAlpha = 1;
  }
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  ctx.fillStyle = '#07080f';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shake > 0.1) {
    ctx.translate(
      (Math.random() - 0.5) * shake,
      (Math.random() - 0.5) * shake
    );
  }

  drawArena();
  drawBorderFill();

  if (state !== 'menu') {
    drawEnemies();
    drawBullets();
    drawPlayer();
    drawFloaters();
  }

  drawBorderEdge();
  drawParticles();

  ctx.restore();

  drawUI();

  if (state === 'menu')  drawMenu();
  if (state === 'over')  drawGameOver();

  if (hitFlash > 0) {
    ctx.fillStyle = 'rgba(255,40,80,' + (hitFlash * 0.28) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* =========================================================
   LOOP
   ========================================================= */
let last = 0;

function loop(now) {
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  update(dt);
  render();

  requestAnimationFrame(loop);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) last = 0;
});

/* =========================================================
   ARRANQUE
   ========================================================= */
initWorld();
state = 'menu';
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
